# Что показывает: базовая раскладка и визуальные примитивы без логики.
# Механизмы: panel (items, flex/grid через style), container (content),
# text, icon, badge, avatar, image; CSS-переменные Taiga (var(--tui-*)).
type: component
root:
  type: panel
  style:
    flex-direction: column
    gap: 2rem
    padding: 2rem
  items:
    - type: text
      style:
        font: var(--tui-font-heading-h1)
      text: Демо раскладки
    - type: container
      style:
        border-radius: var(--tui-radius-l)
        box-shadow: var(--tui-shadow-small)
        padding: 1.25rem
      content:
        type: panel
        style:
          align-items: center
          gap: 1rem
        items:
          - type: icon
            icon: "@tui.fancy.medium.star"
          - type: avatar
            shape: circle
            size: m
            content:
              type: text
              text: ДП
          - type: badge
            appearance: positive
            size: m
            content:
              type: text
              text: Активен
          - type: text
            style:
              font: var(--tui-font-body-l)
            text: Строка с иконкой, аватаром и бейджем
    - type: panel
      style:
        display: grid
        gap: 1rem
        grid-template-columns: 1fr 1fr
      items:
        - type: container
          style:
            background: var(--tui-background-neutral-1)
            border-radius: var(--tui-radius-m)
            padding: 1rem
          content:
            type: text
            text: Левая колонка грида
        - type: container
          style:
            background: var(--tui-background-neutral-1)
            border-radius: var(--tui-radius-m)
            padding: 1rem
          content:
            type: image
            style:
              inline-size: 100%
              object-fit: contain
            src: https://s3-msk.tinkoff.ru/twork-nitro-front-public/placeholder.png
