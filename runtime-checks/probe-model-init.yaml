# ПРОБА (не эталон, агент не читает): эмитит ли модель state при инициализации.
# Экран сам покажет ответ. Результат фиксируем правилом в README.
type: component
root:
  type: panel
  style:
    padding: 2rem
  items:
    - type: text
      id: answerText
      style:
        font: var(--tui-font-heading-h3)
      text: "state при инициализации НЕ приходит"
models:
  probe:
    schema:
      type: object
      properties:
        v:
          type: number
          default: 1
bindings:
  - triggers:
      probe:
        - state
    actions:
      - target: answerText
        action: setInputs
        payload:
          type: JSONata
          expression: '{"text": "state при инициализации ПРИХОДИТ (v=" & $string(probe.state.v) & ")"}'
